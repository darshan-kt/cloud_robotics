# Milestone 3 configuration - see docs/03-mqtt-layer.md.
#
# Anonymous access is off. Every client authenticates with a username and
# password (generated at container startup by docker-entrypoint-wrapper.sh
# from environment variables - see that file for why nothing is committed
# here in plaintext), and every authenticated client is further restricted
# by aclfile to only the topics its role should touch.

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile

# --- Resource limits (docs/security-findings.md F2) ---
# Without these, message_size_limit defaults to 0 (unlimited): any client
# holding a valid credential - and every robot in the fleet currently
# shares one password - could publish an arbitrarily large payload, which
# the backend then json.loads() on its single asyncio event loop, stalling
# telemetry for the ENTIRE fleet. The largest legitimate message here is a
# LiDAR scan (~8 KB) or an SDP offer (~6 KB); 256 KB is generous headroom.
message_size_limit 262144
# Connection exhaustion bound. Comfortably above one backend + one robot
# per fleet member; raise deliberately as the fleet grows.
max_connections 200
# Bounds broker memory when a subscriber (the backend) falls behind rather
# than letting the queue grow without limit.
max_queued_messages 1000
max_inflight_messages 20
# Caps how long a half-dead client can hold a connection slot.
max_keepalive 120

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
