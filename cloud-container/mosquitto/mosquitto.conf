# Milestone 3 configuration - see docs/03-mqtt-layer.md.
#
# Anonymous access is off. Every client authenticates with a username and
# password (generated at container startup by docker-entrypoint-wrapper.sh
# from environment variables - see that file for why nothing is committed
# here in plaintext), and every authenticated client is further restricted
# by aclfile to only the topics its role should touch.

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
