server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Milestone 12 - this file had no security headers at all before.
    # connect-src stays broad (ws:/wss:/http:/https:) rather than pinned to
    # exact hosts because the backend/TURN addresses are only known at
    # container start (see inject-runtime-config.sh's envsubst) - tightening
    # this to the real, exact origins would mean templating this file the
    # same way config.json already is, which is real follow-up work, not
    # done here. See docs/12-security-hardening.md.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: http: https:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /config.json {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: any unmatched path serves index.html so React Router
    # (once routing exists) can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
