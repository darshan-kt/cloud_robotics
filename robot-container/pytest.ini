[pytest]
pythonpath = .
asyncio_mode = auto
# If ROS2 is sourced on your machine (common for this project's audience),
# its `launch_testing`/`launch_ros` pytest plugins get auto-discovered and
# crash on collection (they import things this venv doesn't have). They're
# irrelevant to these unit tests, so keep them out explicitly rather than
# requiring every contributor to run in a ROS2-free shell.
addopts = -p no:launch_testing -p no:launch_ros
