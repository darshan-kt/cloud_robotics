# Optional compose override that exposes the HOST's X11 display to the
# robot container, so `gzclient` (Gazebo's GUI) can attach to the
# already-running `gzserver` for local visual debugging - see README.md's
# "Watching the simulation visually" section.
#
# NOT applied by default, and deliberately separate from the platform's
# actual UI: this project's real operator console shows the robot through
# its camera feed over WebRTC (see docs/00-overview.md), the same way an
# operator would see a real robot - gzclient is a development convenience
# for watching the physics simulation itself move while you drive it, not
# part of what ships. The launch file itself (simulation.launch.py) never
# starts gzclient - this override only makes it POSSIBLE to attach one
# from outside, on demand.
#
# Requires a host with a real X11 (or XWayland) display:
#
#   xhost +local:docker
#   docker compose -f docker-compose.yml -f docker-compose.gui.yml up -d --build
#   docker exec -it cloud-robotics-robot gzclient
#
# (or just `make up-gui` / `make gzclient` - see Makefile)
services:
  robot:
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
