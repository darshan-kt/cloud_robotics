server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unmatched path serves index.html so react-router-dom's
    # BrowserRouter can handle client-side navigation (/login, /store,
    # /dashboard, etc. all need to resolve here, not 404 from nginx).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
