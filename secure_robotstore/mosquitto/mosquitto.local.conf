# Broker config for running mosquitto directly on your machine, with no Docker.
#
# This is the file you edit in exercises 1, 2, 7 and 9. It is separate from
# mosquitto.conf only because that one writes its persistence files to
# /mosquitto/data/, a path that exists inside the Docker image and not on
# your laptop. Everything else about the two files is the same.
#
# Run it from the secure_robotstore directory, in its own terminal:
#
#   mosquitto -c mosquitto/mosquitto.local.conf -v
#
# -v prints every connection and subscription, which is how you will debug
# most of the broker exercises. Stop it with Ctrl-C; restart it after every
# edit to this file.
#
# INTERN TASK (security): this config is the single biggest hole in the demo.
#
#   1. allow_anonymous false + a password file. Right now ANY client that can
#      reach port 1884 can connect with no credentials at all.
#   2. An acl_file. Without one, any connected client can both publish AND
#      subscribe to every topic.
#   3. A TLS listener on 8883 with certificates. Everything here is plaintext.
#   4. message_size_limit, so one client cannot stall the backend's JSON parse.
#
# Compare with cloud-container/mosquitto/mosquitto.conf, which has all four.

listener 1884
allow_anonymous true

# No persistence: nothing here is worth keeping across a restart, and this
# avoids needing a writable data directory.
persistence false

log_dest stdout
log_type warning
log_type error
log_type notice
