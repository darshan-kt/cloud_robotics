# Mosquitto — wide open, on purpose.
#
# INTERN TASK (security): this config is the single biggest hole in the
# demo. Compare it with cloud-container/mosquitto/mosquitto.conf, which has
# all of the following and none of which is here:
#
#   1. allow_anonymous false  + a password file. Right now ANY client that
#      can reach port 1883 can connect with no credentials at all.
#   2. An ACL file (acl_file). Without one, any connected client can both
#      publish AND subscribe to every topic — so anything on this network
#      can forge device readings, or publish commands to devices/+/cmd and
#      the agent will act on them.
#   3. A TLS listener on 8883 with certificates. Everything here is
#      plaintext: `mosquitto_sub -t '#' -v` prints all traffic.
#   4. message_size_limit, to stop one client sending a payload large
#      enough to stall the backend's JSON parse.
#
# Prove the problem before fixing it:
#   mosquitto_sub -h localhost -p 1884 -t 'devices/#' -v
#   mosquitto_pub -h localhost -p 1884 -t devices/demo-device-01/int \
#       -m '{"value":999,"seq":999999}'
# The forged reading appears in the browser, in Redis, and in Postgres.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice
