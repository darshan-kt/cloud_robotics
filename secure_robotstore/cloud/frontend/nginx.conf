server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # INTERN TASK (security): this file has NO security headers. The real
    # frontend (cloud-container/frontend/nginx.conf) sets
    # X-Content-Type-Options, X-Frame-Options, Referrer-Policy,
    # Permissions-Policy and a Content-Security-Policy. Adding them here,
    # and understanding what each one actually stops, is the exercise.

    # SPA fallback so React Router handles client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
